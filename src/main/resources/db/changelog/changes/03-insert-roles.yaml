databaseChangeLog:
  - changeSet:
      id: create-roles-table
      author: davydov
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
  - changeSet:
      id: insert-roles
      author: davydov
      changes:
        - insert:
             tableName: roles
             columns:
               - column:
                   name: name
                   value: "ROLE_USER"
        - insert:
             tableName: roles
             columns:
               - column:
                   name: name
                   value: "ROLE_ADMIN"
